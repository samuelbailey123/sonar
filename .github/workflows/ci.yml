name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short -race -count=1 -coverprofile=coverage.out ./...

      - name: Build
        run: go build -o sonar .

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-self-hosted
          path: coverage.out
          retention-days: 7
